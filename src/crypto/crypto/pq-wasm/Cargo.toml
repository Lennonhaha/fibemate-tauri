[package]
name = "fibemate-pq-wasm"
version = "0.1.0"
edition = "2021"
authors = ["FIBEMATE Team"]
description = "ML-KEM-768 Post-Quantum Cryptography for FIBEMATE"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM bindings
wasm-bindgen = "0.2"
js-sys = "0.3"

# ML-KEM-768 (Kyber-768) via pqc_kyber
pqc_kyber = { version = "0.7", features = ["kyber768"] }

# HKDF for hybrid key combination
hkdf = "0.12"

# Cryptographic utilities
sha2 = "0.10"
base64 = "0.22"

# Random number generation
rand = { version = "0.8", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }

# Secure zeroization of sensitive key material
zeroize = { version = "1.8", default-features = false, features = ["derive", "alloc"] }

# Error handling
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[profile.release]
opt-level = 3
lto = true
