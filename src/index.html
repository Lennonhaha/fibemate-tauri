<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIBEMATE - 隐私即时通讯</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Tauri Bridge: polyfills window.electronAPI for native desktop features -->
  <script src="tauri-bridge.js"></script>
  <!-- FIBEMATE_ZK polyfill: doLogin/doRegister bridge -->
  <script src="fibemate-zk-polyfill.js"></script>
  <script src="secure-key-storage.js"></script>
  <script src="key-storage-migration.js"></script>
  <script src="key-manager.js"></script>
  <script src="crypto/crypto/ml-kem-768.js"></script>
  <script src="crypto/crypto/ml-kem-768-wrapper.js"></script>
  <script src="crypto/crypto/pq-integration.js"></script>
  <!-- Tauri Crypto Bridge: replaces WASM ML-KEM with Rust backend -->
  <script src="tauri-crypto-bridge.js"></script>
  <!-- ZK experiment gate: only loads src/zk/* when FIBEMATE_EXPERIMENT_ZK is set (default off) -->
  <script src="load-zk-if-enabled.js"></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="login-card">
      <!-- Logo 区域 -->
      <div class="logo-area">
        <div class="logo-bg-circle"></div>
        <div class="shield-logo">
          <svg viewBox="0 0 64 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#5CFFE3"/>
                <stop offset="100%" style="stop-color:#00E5C3"/>
              </linearGradient>
              <filter id="shieldGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="0.8" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
            <g filter="url(#shieldGlow)">
              <path d="M32 4L58 14V36C58 50 48 60 32 66C16 60 6 50 6 36V14L32 4Z"
                    stroke="url(#shieldGrad)" stroke-width="2.5" fill="none"/>
              <path d="M32 12L50 20V36C50 46 42 54 32 58C22 54 14 46 14 36V20L32 12Z"
                    stroke="url(#shieldGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
              <circle cx="32" cy="32" r="6" stroke="url(#shieldGrad)" stroke-width="2" fill="none"/>
              <path d="M32 38V48" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M32 8L52 17V22" stroke="url(#shieldGrad)" stroke-width="0.8" opacity="0.5"/>
            </g>
          </svg>
        </div>
        <h1 class="brand-name">FIBEMATE</h1>
        <p class="brand-sub">Security-First Messaging · End-to-End Encryption</p>
      </div>

      <!-- 安全徽章 -->
      <div class="security-badge">
        <svg width="10" height="12" viewBox="0 0 10 12" fill="none">
          <path d="M5 1L9 2.5V6C9 8.5 7 10.5 5 11.5C3 10.5 1 8.5 1 6V2.5L5 1Z"
                stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
        <span>End-to-End Encryption · Zero-Knowledge Proof</span>
      </div>

      <!-- 登录方式切换 -->
      <div class="login-tabs">
        <button type="button" class="tab-btn active" data-tab="password">&#x5BC6;&#x7801;&#x767B;&#x5F55;</button>
        <button type="button" class="tab-btn" data-tab="phone">&#x624B;&#x673A;&#x53F7;&#x767B;&#x5F55;</button>
      </div>

      <!-- 密码登录表单 -->
      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="input-group">
          <input type="text" id="username" name="fm_un" placeholder="&#x7528;&#x6237;&#x540D;"
            spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" required>
        </div>
        <div class="input-group">
          <input type="password" id="password" name="fm_pw" placeholder="&#x5BC6;&#x7801;"
            autocomplete="off" required>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <svg width="14" height="16" viewBox="0 0 14 16" fill="none" style="margin-right:6px">
            <rect x="2" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/>
            <path d="M4 7V5C4 3.34 5.34 2 7 2C8.66 2 10 3.34 10 5V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="7" cy="11" r="1" fill="currentColor"/>
          </svg>
          <span id="loginBtnText">&#x767B;&#x5F55; · &#x6CE8;&#x518C;</span>
        </button>

        <div id="loginError" class="error-msg" style="display:none"></div>
      </form>

      <!-- 手机号登录表单（默认隐藏，由 JS 控制显示） -->
      <form class="login-form" id="phoneLoginForm" style="display:none" autocomplete="off">
        <div class="input-group">
          <input type="tel" id="phoneNumber" name="fm_ph" placeholder="&#x624B;&#x673A;&#x53F7;"
            maxlength="11" pattern="1[3-9]\d{9}" autocomplete="off" autocorrect="off" required>
        </div>
        <div class="input-group captcha-group">
          <input type="text" id="phoneCaptcha" name="fm_cp" placeholder="&#x9A8C;&#x8BC1;&#x7801;"
            maxlength="6" autocomplete="off" autocorrect="off" required>
          <button type="button" class="btn-captcha" id="sendCaptchaBtn">&#x83B7;&#x53D6;&#x9A8C;&#x8BC1;&#x7801;</button>
        </div>

        <button type="submit" class="btn-primary" id="phoneLoginBtn">
          <span id="phoneLoginBtnText">&#x767B;&#x5F55; / &#x6CE8;&#x518C;</span>
        </button>

        <div id="phoneLoginError" class="error-msg" style="display:none"></div>
      </form>

      <!-- 分隔线 -->
      <div class="divider">
        <span></span>
        <span class="divider-text">&#x6216;</span>
        <span></span>
      </div>

      <!-- 注册入口 -->
      <p class="register-link">
        &#x8FD8;&#x6CA1;&#x6709;&#x8D26;&#x53F7;&#xFF1F; <a href="#" id="goRegister">&#x7ACB;&#x5373;&#x6CE8;&#x518C; &#x2192;</a>
      </p>

      <!-- 用户协议 -->
      <div class="agreement-links">
        &#x767B;&#x5F55;&#x5373;&#x8868;&#x793A;&#x540C;&#x610F; <a href="agreement.html" target="_blank">&#x7528;&#x6237;&#x534F;&#x8BAE;</a>
        &#x548C; <a href="privacy.html" target="_blank">&#x9690;&#x79C1;&#x653F;&#x7B56;</a>
      </div>

      <!-- 底部安全标识 -->
      <div class="footer-badge">
        <svg width="8" height="10" viewBox="0 0 8 10" fill="none">
          <path d="M4 1L7 2V5C7 7 5.5 8.5 4 9.5C2.5 8.5 1 7 1 5V2L4 1Z"
                stroke="currentColor" stroke-width="0.8" fill="none" opacity="0.5"/>
        </svg>
        <span>Zero-Knowledge · Privacy First</span>
      </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast" style="display:none"></div>
  </div>

  <!-- 注册页面（隐藏） -->
  <div class="register-wrapper" id="registerView" style="display:none">
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>
    <div class="login-card">
      <div class="logo-area">
        <div class="shield-logo">
          <svg viewBox="0 0 64 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="shieldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#5CFFE3"/>
                <stop offset="100%" style="stop-color:#00E5C3"/>
              </linearGradient>
            </defs>
            <g>
              <path d="M32 4L58 14V36C58 50 48 60 32 66C16 60 6 50 6 36V14L32 4Z"
                    stroke="url(#shieldGrad2)" stroke-width="2.5" fill="none"/>
              <path d="M32 12L50 20V36C50 46 42 54 32 58C22 54 14 46 14 36V20L32 12Z"
                    stroke="url(#shieldGrad2)" stroke-width="1.5" fill="none" opacity="0.6"/>
              <circle cx="32" cy="32" r="6" stroke="url(#shieldGrad2)" stroke-width="2" fill="none"/>
              <path d="M32 38V48" stroke="url(#shieldGrad2)" stroke-width="2.5" stroke-linecap="round"/>
            </g>
          </svg>
        </div>
        <h1 class="brand-name">FIBEMATE</h1>
        <p class="brand-sub">&#x521B;&#x5EFA;&#x8D26;&#x53F7;</p>
      </div>

      <!-- 注册表单 -->
      <form class="login-form" id="registerForm" autocomplete="off">
        <div class="input-group">
          <input type="text" id="regUsername" name="fm_ru" placeholder="&#x7528;&#x6237;&#x540D;"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="input-group">
          <input type="password" id="regPassword" name="fm_rp" placeholder="&#x5BC6;&#x7801;&#xFF08;&#x81F3;&#x5C11;8&#x4F4D;&#xFF09;"
            autocomplete="off" required>
        </div>
        <div class="input-group">
          <input type="password" id="regPasswordConfirm" name="fm_rc" placeholder="&#x786E;&#x8BA4;&#x5BC6;&#x7801;"
            autocomplete="off" required>
        </div>

        <button type="submit" class="btn-primary" id="registerBtn">
          <span id="registerBtnText">&#x521B;&#x5EFA;&#x8D26;&#x53F7;</span>
        </button>
        <div id="registerError" class="error-msg" style="display:none"></div>
        <button type="button" class="btn-text" id="goLogin">&#x5DF2;&#x6709;&#x8D26;&#x53F7;&#xFF1F;&#x7ACB;&#x5373;&#x767B;&#x5F55; &#x2192;</button>
      </form>
    </div>
  </div>

  <script src="login-bootstrap.js"></script>
</body>
</html>
