<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIBEMATE 卫星网络适配测试</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #fff;
      padding: 20px;
      line-height: 1.6;
    }
    
    h1 {
      color: #00E5C3;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #888;
      margin-bottom: 30px;
    }
    
    .section {
      background: #1a1a24;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .section h2 {
      color: #00E5C3;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #333;
    }
    
    .status-indicator.active {
      background: #00E5C3;
      box-shadow: 0 0 10px rgba(0, 229, 195, 0.5);
    }
    
    .status-indicator.warning {
      background: #ff9800;
    }
    
    .status-indicator.error {
      background: #f44336;
    }
    
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #333;
    }
    
    .metric:last-child {
      border-bottom: none;
    }
    
    .metric-label {
      color: #888;
    }
    
    .metric-value {
      color: #fff;
      font-weight: 600;
    }
    
    .btn {
      background: linear-gradient(135deg, #00E5C3, #00B4A0);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    
    .btn:hover {
      opacity: 0.9;
    }
    
    .btn-secondary {
      background: #333;
      color: #fff;
    }
    
    .log {
      background: #0a0a0f;
      border-radius: 8px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 15px;
    }
    
    .log-entry {
      margin-bottom: 5px;
      color: #888;
    }
    
    .log-entry.info {
      color: #00E5C3;
    }
    
    .log-entry.warning {
      color: #ff9800;
    }
    
    .log-entry.error {
      color: #f44336;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
  </style>
</head>
<body>
  <h1>🛰️ FIBEMATE 卫星网络适配测试</h1>
  <p class="subtitle">测试网络检测、卫星模式切换、FEC和快速重连功能</p>

  <div class="grid">
    <!-- 网络状态 -->
    <div class="section">
      <h2>网络状态</h2>
      <div class="status">
        <div class="status-indicator" id="networkStatus"></div>
        <span id="networkType">检测中...</span>
      </div>
      <div class="metric">
        <span class="metric-label">RTT</span>
        <span class="metric-value" id="rttValue">-</span>
      </div>
      <div class="metric">
        <span class="metric-label">丢包率</span>
        <span class="metric-value" id="lossValue">-</span>
      </div>
      <div class="metric">
        <span class="metric-label">下行带宽</span>
        <span class="metric-value" id="bandwidthValue">-</span>
      </div>
    </div>

    <!-- 卫星模式 -->
    <div class="section">
      <h2>卫星模式</h2>
      <div class="status">
        <div class="status-indicator" id="satelliteStatus"></div>
        <span id="satelliteMode">未激活</span>
      </div>
      <div class="metric">
        <span class="metric-label">混合网跳数</span>
        <span class="metric-value" id="hopsValue">5</span>
      </div>
      <div class="metric">
        <span class="metric-label">FEC冗余</span>
        <span class="metric-value" id="fecValue">关闭</span>
      </div>
      <div class="metric">
        <span class="metric-label">心跳间隔</span>
        <span class="metric-value" id="heartbeatValue">30s</span>
      </div>
    </div>

    <!-- FEC统计 -->
    <div class="section">
      <h2>FEC统计</h2>
      <div class="metric">
        <span class="metric-label">编码包数</span>
        <span class="metric-value" id="encodedValue">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">解码包数</span>
        <span class="metric-value" id="decodedValue">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">恢复包数</span>
        <span class="metric-value" id="recoveredValue">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">丢包数</span>
        <span class="metric-value" id="lostValue">0</span>
      </div>
    </div>

    <!-- 重连统计 -->
    <div class="section">
      <h2>重连统计</h2>
      <div class="metric">
        <span class="metric-label">总尝试次数</span>
        <span class="metric-value" id="attemptsValue">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">成功次数</span>
        <span class="metric-value" id="successValue">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">失败次数</span>
        <span class="metric-value" id="failedValue">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">平均耗时</span>
        <span class="metric-value" id="avgTimeValue">-</span>
      </div>
    </div>
  </div>

  <!-- 控制按钮 -->
  <div class="section">
    <h2>测试控制</h2>
    <button class="btn" onclick="startDetection()">开始网络检测</button>
    <button class="btn" onclick="switchToSatellite()">切换卫星模式</button>
    <button class="btn" onclick="switchToNormal()">切换普通模式</button>
    <button class="btn btn-secondary" onclick="testFEC()">测试FEC</button>
    <button class="btn btn-secondary" onclick="testReconnect()">测试重连</button>
    <button class="btn btn-secondary" onclick="clearLog()">清空日志</button>
  </div>

  <!-- 日志 -->
  <div class="section">
    <h2>运行日志</h2>
    <div class="log" id="logContainer">
      <div class="log-entry info">等待开始测试...</div>
    </div>
  </div>

  <!-- 引入模块 -->
  <script src="network-detector.js"></script>
  <script src="satellite-mode.js"></script>
  <script src="fec.js"></script>
  <script src="rapid-reconnect.js"></script>
  <script src="satellite-integration.js"></script>

  <script>
    // 全局变量
    let detector = null;
    let satellite = null;
    let fec = null;
    let reconnect = null;
    let integration = null;

    // 日志函数
    function log(message, type = 'info') {
      const container = document.getElementById('logContainer');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    }

    // 更新UI
    function updateNetworkUI(info) {
      document.getElementById('networkType').textContent = info.type;
      document.getElementById('rttValue').textContent = 
        info.metrics.rttSamples.length > 0 
          ? `${Math.round(info.metrics.rttSamples[info.metrics.rttSamples.length - 1])}ms`
          : '-';
      document.getElementById('lossValue').textContent = `${info.metrics.packetLoss}%`;
      
      const indicator = document.getElementById('networkStatus');
      indicator.className = 'status-indicator active';
      
      if (info.type === 'satellite') {
        indicator.style.background = '#ff9800';
      } else if (info.type === '5g') {
        indicator.style.background = '#00E5C3';
      }
    }

    function updateSatelliteUI(info) {
      document.getElementById('satelliteMode').textContent = 
        info.isActive ? '已激活' : '未激活';
      document.getElementById('hopsValue').textContent = 
        info.isActive ? info.config.mixnetHops : 5;
      document.getElementById('fecValue').textContent = 
        info.isActive ? `${info.config.fecRedundancy * 100}%` : '关闭';
      document.getElementById('heartbeatValue').textContent = 
        info.isActive ? `${info.config.heartbeatInterval / 1000}s` : '30s';
      
      const indicator = document.getElementById('satelliteStatus');
      indicator.className = info.isActive ? 'status-indicator active' : 'status-indicator';
    }

    function updateFECUI(stats) {
      document.getElementById('encodedValue').textContent = stats.packetsEncoded;
      document.getElementById('decodedValue').textContent = stats.packetsDecoded;
      document.getElementById('recoveredValue').textContent = stats.packetsRecovered;
      document.getElementById('lostValue').textContent = stats.packetsLost;
    }

    function updateReconnectUI(stats) {
      document.getElementById('attemptsValue').textContent = stats.totalAttempts;
      document.getElementById('successValue').textContent = stats.successfulReconnects;
      document.getElementById('failedValue').textContent = stats.failedReconnects;
      document.getElementById('avgTimeValue').textContent = 
        stats.averageTime > 0 ? `${Math.round(stats.averageTime)}ms` : '-';
    }

    // 测试函数
    function startDetection() {
      log('启动网络检测...');
      
      detector = new NetworkDetector({ debug: true });
      
      detector.addListener((newType, oldType) => {
        log(`网络切换: ${oldType} -> ${newType}`, 'warning');
        updateNetworkUI(detector.getInfo());
      });
      
      detector.startMonitoring((type) => {
        log(`当前网络: ${type}`);
        updateNetworkUI(detector.getInfo());
      });
    }

    function switchToSatellite() {
      log('切换到卫星模式...');
      
      if (!satellite) {
        // 模拟FIBEMATE核心
        const mockCore = createMockCore();
        satellite = new SatelliteMode(mockCore, { debug: true });
      }
      
      satellite.apply();
      updateSatelliteUI(satellite.getInfo());
      log('卫星模式已激活', 'warning');
    }

    function switchToNormal() {
      log('切换到普通模式...');
      
      if (satellite) {
        satellite.deactivate();
        updateSatelliteUI(satellite.getInfo());
        log('已切换到普通模式');
      }
    }

    function testFEC() {
      log('测试FEC编码/解码...');
      
      fec = new ForwardErrorCorrection({ redundancy: 0.3, debug: true });
      
      // 创建测试数据
      const testData = new TextEncoder().encode('Hello, FIBEMATE Satellite!');
      
      // 编码
      const encoded = fec.encode(testData);
      log(`编码完成: ${encoded.length} 个包`);
      
      // 模拟丢包（删除30%的包）
      const received = encoded.map((p, i) => 
        Math.random() > 0.3 ? p : null
      );
      
      const lostCount = received.filter(p => p === null).length;
      log(`模拟丢包: ${lostCount}/${encoded.length} 个包丢失`, 'warning');
      
      // 解码
      const result = fec.decode(received, encoded.length);
      
      if (result.success) {
        const decoded = new TextDecoder().decode(result.data);
        log(`解码成功! 恢复: ${result.stats.recovered} 个包`, 'info');
        log(`原始数据: "${decoded}"`);
      } else {
        log('解码失败，数据无法恢复', 'error');
      }
      
      updateFECUI(fec.getStats());
    }

    function testReconnect() {
      log('测试快速重连...');
      
      reconnect = new RapidReconnect({
        maxAttempts: 5,
        baseInterval: 500,
        debug: true
      });
      
      let attemptCount = 0;
      
      reconnect.on('attempt', (data) => {
        log(`重连尝试 ${data.attempt}/${data.maxAttempts}`);
      });
      
      reconnect.on('success', (data) => {
        log(`重连成功! 耗时: ${data.totalTime}ms`, 'info');
        updateReconnectUI(reconnect.getStats());
      });
      
      reconnect.on('failure', (data) => {
        log(`重连失败! 尝试次数: ${data.attempts}`, 'error');
        updateReconnectUI(reconnect.getStats());
      });
      
      // 模拟连接函数（前2次失败，第3次成功）
      reconnect.reconnect(async () => {
        attemptCount++;
        await new Promise(resolve => setTimeout(resolve, 200));
        
        if (attemptCount < 3) {
          throw new Error('Connection refused');
        }
        
        return { connected: true };
      }).catch(() => {});
    }

    function clearLog() {
      document.getElementById('logContainer').innerHTML = '';
      log('日志已清空');
    }

    // 模拟FIBEMATE核心
    function createMockCore() {
      return {
        setMixnetHops: (hops) => log(`设置混合网跳数: ${hops}`),
        setFEC: (enabled, redundancy) => log(`设置FEC: ${enabled}, 冗余: ${redundancy}`),
        setHeartbeatInterval: (interval) => log(`设置心跳间隔: ${interval}ms`),
        setHeartbeatTimeout: (timeout) => log(`设置心跳超时: ${timeout}ms`),
        setReconnectPolicy: (policy) => log(`设置重连策略: ${JSON.stringify(policy)}`),
        setMessageBufferSize: (size) => log(`设置消息缓冲: ${size}`),
        setCoverTrafficInterval: (interval) => log(`设置假包间隔: ${interval}ms`),
        setMaxPacketSize: (size) => log(`设置最大包大小: ${size}`),
        pauseCoverTraffic: () => log('暂停假包'),
        resumeCoverTraffic: () => log('恢复假包'),
        sendKeepAlive: () => {},
        emit: (event, data) => log(`事件: ${event}`),
        on: (event, handler) => {},
        sendMessage: (msg) => log('发送消息')
      };
    }

    // 初始化
    log('FIBEMATE 卫星网络适配测试页面已加载');
    log('点击"开始网络检测"启动测试');
  </script>
</body>
</html>
