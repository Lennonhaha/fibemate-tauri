# SPDX-License-Identifier: GPL-3.0-only
name: OpenSSF Scorecard

# Supply-chain posture of the default branch. publish_results:true pushes the
# numbers to the public OpenSSF database, so the README badge shows real scores
# instead of "no data".
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'   # Mondays 00:00 UTC, weekly (do not run more often)
  push:
    branches: [main]

# Least privilege: read-only by default, elevate only inside the job.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # OIDC token required by publish_results
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif

      - name: Upload results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7
