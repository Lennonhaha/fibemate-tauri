# Promote a draft stable release to public.
#
# The stable lane of release-train.yml creates a draft release. This workflow is
# the manual promotion gate: it is skipped while RELEASE_TRAIN_FROZEN=true,
# requires a typed confirmation, only accepts a release that is still draft, and
# refuses a draft built from anything other than the current main head (#118).
# It does not implement percentage rollout; see docs/RELEASE-TRAIN.md.

name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Draft release tag to publish (for example v3.3.14)'
        required: true
        type: string
      confirm:
        description: 'Type PROMOTE to publish the draft'
        required: true
        type: string

permissions:
  contents: read   # publishing is the promote job's own grant

jobs:
  promote:
    permissions:
      contents: write   # flip the draft to published
    if: ${{ vars.RELEASE_TRAIN_FROZEN != 'true' }}
    runs-on: ubuntu-latest
    environment: stable-release
    steps:
      - name: Validate promotion input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ -n "$TAG" ] || { echo "::error::tag is required"; exit 1; }
          [ "$CONFIRM" = "PROMOTE" ] || { echo "::error::confirm must be PROMOTE"; exit 1; }
          echo "promotion requested for $TAG"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Refuse a draft that predates main (#118)
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: node scripts/check-draft-baseline.cjs --tag "$TAG"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.baseline.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,url --jq '{isDraft,isPrerelease,url}'
