name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Rust clippy (ubuntu only; lint is platform-independent)
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features

      - name: Rust tests (PQC crypto backend)
        working-directory: src-tauri
        run: cargo test --all-features

  bench:
    name: Perf regression gate (criterion)
    # Timing gates are only meaningful on a single consistent runner to avoid
    # cross-hardware noise; ubuntu-latest matches the baseline hardware class.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Reduced warm-up/measurement time keeps the job fast; thresholds in
      # perf_thresholds.json are baseline x3, which absorbs the extra variance.
      # --bench perf is REQUIRED: a bare `cargo bench` also runs the lib target
      # under libtest's bench harness, which rejects criterion's
      # --warm-up-time/--measurement-time flags (exit 101).
      - name: Run crypto hot-path benchmarks
        working-directory: src-tauri
        run: cargo bench --bench perf -- --warm-up-time 1 --measurement-time 2

      # Memory footprint of DR sessions. Separate target because the unit is
      # bytes, not time; writes target/criterion/memory.json for the gate.
      - name: Run session memory footprint benchmark
        working-directory: src-tauri
        run: cargo bench --bench memory

      - name: Enforce perf thresholds
        working-directory: src-tauri
        run: python3 scripts/perf_check.py
