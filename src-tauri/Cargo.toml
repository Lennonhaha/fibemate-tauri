[package]
name = "fibemate"
version = "3.0.0"
description = "FIBEMATE - Post-Quantum Secure Messaging"
authors = ["FIBEMATE Team"]
edition = "2021"

[lib]
name = "fibemate_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Post-Quantum Cryptography ──
rustpq = { version = "0.3", features = ["mlkem768", "mldsa65"] }

# ── Classical Cryptography ──
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"

# ── Secure Memory ──
zeroize = { version = "1.8", features = ["derive"] }

# ── Encoding ──
hex = "0.4"
base64 = "0.22"

# ── UUID for key/session IDs ──
uuid = { version = "1", features = ["v4"] }

# ── Big Integer Arithmetic (SM2) ──
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
lazy_static = "1"

# ── Windows DPAPI (device-key protection at rest) ──
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Foundation"
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
opt-level = "z"
strip = "symbols"
debug = 0
